<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flinke Finger - Deutscher Tipp-Trainer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
  <!-- Game View -->
  <div id="game-view" class="view active" tabindex="0">

    <div class="game-header">
      <div>
        <h2 id="lesson-title">Lektion</h2>
        <span id="lesson-progress">Text 1/5</span>
      </div>
      <div class="game-controls">
        <button id="back-btn">← Menü</button>
      </div>
    </div>
    
    <div id="text-display">
      <!-- Current text will be rendered here -->
    </div>
    
    <div id="input-area">
      <div id="hand-l-container" class="hand-container">
        <svg viewBox="0 0 180 220" class="hand-svg">
          <g id="hand-left" transform="translate(15, 20)">
            <path class="hand-outline" d="M10,120 L115,120 L115,160 C115,200 10,200 10,160 Z" />
            <path id="l-pinky" class="finger" d="M10,120 L10,70 C10,50 32,50 32,70 L32,120 Z" />
            <path id="l-ring" class="finger" d="M37,120 L37,50 C37,30 59,30 59,50 L59,120 Z" />
            <path id="l-middle" class="finger" d="M64,120 L64,30 C64,10 86,10 86,30 L86,120 Z" />
            <path id="l-index" class="finger" d="M91,120 L91,50 C91,30 113,30 113,50 L113,120 Z" />
            <path id="l-thumb" class="finger" d="M118,140 L150,155 L135,180 L118,160 Z" />
          </g>
        </svg>
      </div>

      <div id="keyboard-container">
        <!-- Keyboard will be rendered here -->
      </div>
      
      <div id="hand-r-container" class="hand-container">
        <svg viewBox="0 0 180 220" class="hand-svg">
          <g id="hand-right" transform="translate(165, 20) scale(-1, 1)">
            <path class="hand-outline" d="M10,120 L115,120 L115,160 C115,200 10,200 10,160 Z" />
            <path id="r-pinky" class="finger" d="M10,120 L10,70 C10,50 32,50 32,70 L32,120 Z" />
            <path id="r-ring" class="finger" d="M37,120 L37,50 C37,30 59,30 59,50 L59,120 Z" />
            <path id="r-middle" class="finger" d="M64,120 L64,30 C64,10 86,10 86,30 L86,120 Z" />
            <path id="r-index" class="finger" d="M91,120 L91,50 C91,30 113,30 113,50 L113,120 Z" />
            <path id="r-thumb" class="finger" d="M118,140 L150,155 L135,180 L118,160 Z" />
          </g>
        </svg>
      </div>
    </div>

    <p class="typing-hint">Tippe den Text ab. Drücke die richtige Taste!</p>
  </div>

  <!-- Start Overlay -->
  <div id="start-overlay" class="hidden">
    <div class="start-content">
      <h2 id="start-lesson-title">Lektion Name</h2>
      <p id="start-lesson-desc">Beschreibung</p>
      
      <div class="start-stats-container">
        <div class="stat-row">
            <span class="stat-label">Zielgeschwindigkeit:</span>
            <span class="stat-value" id="start-target-wpm">0 WPM</span>
        </div>
        
        <div class="best-run-container">
            <h3 class="best-header">Dein Rekord</h3>
            <div class="best-stats-grid">
               <div class="best-stat-row">
                 <span class="stat-key">Genauigkeit:</span>
                 <span class="stat-val"><span id="start-best-acc-val">-</span> <span id="start-best-acc-stars" class="mini-stars"></span></span>
               </div>
               <div class="best-stat-row">
                 <span class="stat-key">Geschwindigkeit:</span>
                 <span class="stat-val"><span id="start-best-wpm-val">-</span> <span id="start-best-wpm-stars" class="mini-stars"></span></span>
               </div>
               <div class="best-stat-row total-row">
                 <span class="stat-key">Gesamt:</span>
                 <span class="stat-val" id="start-best-total-stars"></span>
               </div>
            </div>
        </div>
      </div>

      <div class="result-buttons">
        <button id="start-game-btn"><span class="btn-icon">▶️</span> Starten</button>
        <button id="start-menu-btn"><span class="btn-icon">🏠</span> Menü</button>
      </div>
    </div>
  </div>
  
  <!-- Result Overlay -->
  <div id="result-overlay" class="hidden">
    <div class="result-content">
      <h2>🎉 Lektion abgeschlossen!</h2>
      
      <div id="result-stars">
        <!-- Stars will be rendered here -->
      </div>
      
      <div class="result-stats">
        <p id="result-accuracy">Genauigkeit: 100%</p>
        <p id="result-wpm">Geschwindigkeit: 30 WPM</p>
      </div>
      
      <p id="level-up-message" class="hidden"></p>
      <p id="new-title-message" class="hidden"></p>
      
      <div class="result-buttons">
        <button id="retry-btn"><span class="btn-icon">🔄</span> Nochmal</button>
        <button id="next-btn"><span class="btn-icon">➡️</span> Weiter</button>
        <button id="menu-btn"><span class="btn-icon">🏠</span> Menü</button>
      </div>
    </div>
  </div>
  
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
