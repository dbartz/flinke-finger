<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flinke Finger - Deutscher Tipp-Trainer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
  <!-- Menu View -->
  <div id="menu-view" class="view active">
    <!-- TOC Sidebar -->
    <nav id="stage-toc">
      <h3>Inhalt</h3>
      <ul id="toc-list"></ul>
    </nav>

    <div class="menu-content-wrapper">
      <header class="menu-header">
        <div class="header-inner">
          <img src="resources/cute_robot.png" alt="Robot Mascot" class="robot-mascot">
          
          <div class="header-content">
            <h1>⌨️ <span>Flinke Finger</span></h1>
            <p>Werde zur Tipp-Legende!</p>
            
            <div class="player-info">
              <span id="player-level">Level 1</span>
              <span id="player-title">Anfänger</span>
              <span id="star-count">⭐ 0 / 204</span>
            </div>
            
            <div class="progress-bar">
              <div id="progress-fill"></div>
            </div>
          </div>
        </div>
      </header>

      <div class="keyboard-preview-section">
        <h2>Meine Tasten</h2>
        <div id="keyboard-container"></div>
      </div>
      
      <div id="lessons-grid">
        <!-- Lessons will be rendered here by JavaScript -->
      </div>
      
      <footer class="menu-footer">
        <button id="reset-btn">🗑️ Fortschritt zurücksetzen</button>
      </footer>
    </div>
  </div>
  
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
