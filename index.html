<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flinke Finger - Deutscher Tipp-Trainer</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
  <!-- Menu View -->
  <div id="menu-view" class="view active">
    <header class="menu-header">
      <h1>🎹 Flinke Finger</h1>
      <p>Dein deutscher Tipp-Trainer</p>
      
      <div class="player-info">
        <span id="player-level">Level 1</span>
        <span id="player-title">Anfänger</span>
        <span id="star-count">⭐ 0 / 204</span>
      </div>
      
      <div class="progress-bar">
        <div id="progress-fill"></div>
      </div>
    </header>
    
    <div id="lessons-grid">
      <!-- Lessons will be rendered here by JavaScript -->
    </div>
    
    <footer class="menu-footer">
      <button id="reset-btn">🗑️ Fortschritt zurücksetzen</button>
    </footer>
  </div>
  
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
